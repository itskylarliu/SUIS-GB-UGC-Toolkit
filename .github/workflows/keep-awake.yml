name: Keep Streamlit App Awake

on:
  schedule:
    # This runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://https://suis-gb-ugc-toolkit.streamlit.app/
